# Option 2: Run on a path (/beats)
# Access at: http://64.247.197.112/beats

server {
    listen 80;
    server_name 64.247.197.112 _;

    # Increase client body size for file uploads
    client_max_body_size 100M;

    # Logging
    access_log /var/log/nginx/beats-access.log;
    error_log /var/log/nginx/beats-error.log;

    # Handle favicon requests (return 204 to prevent 404 errors)
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }

    # Redirect /beats to /beats/ (with trailing slash)
    location = /beats {
        return 301 /beats/;
    }

    # Serve static files FIRST (more specific, must come before /beats/)
    location /beats/static {
        alias /home/ubuntu/beats/shared/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Serve Beat HQ app on /beats path (must come after /beats/static)
    location /beats/ {
        # Strip /beats prefix and proxy to Flask
        rewrite ^/beats/?(.*)$ /$1 break;
        
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Important: Set the script name for Flask APPLICATION_ROOT
        proxy_set_header SCRIPT_NAME /beats;
        proxy_set_header X-Script-Name /beats;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}

